<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>notes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111;
      --bg2: #1a1a1a;
      --bg3: #222;
      --border: #2a2a2a;
      --text: #e0e0e0;
      --muted: #666;
      --accent: #c8903f;
      --danger: #c0392b;
      --radius: 6px;
      --font: 'DM Sans', system-ui, sans-serif;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }

    /* ── Gate ── */
    #gate { display: flex; align-items: center; justify-content: center; height: 100vh; }
    #gate form { display: flex; flex-direction: column; gap: 10px; width: 260px; }
    #gate input {
      padding: 10px 12px; background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-family: var(--font);
      font-size: 15px; outline: none;
    }
    #gate input:focus { border-color: var(--accent); }
    #gate button {
      padding: 10px; background: var(--accent); border: none; border-radius: var(--radius);
      color: #111; font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer;
    }
    #gate .err { color: #e05555; font-size: 13px; }

    /* ── App ── */
    #app { display: none; height: 100vh; flex-direction: column; }
    #app.open { display: flex; }

    /* toolbar */
    #toolbar {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    #toolbar .spacer { flex: 1; }
    .tbtn {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 10px; background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--muted); font-family: var(--font);
      font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    .tbtn:hover { color: var(--text); border-color: #444; }
    .tbtn.danger { color: var(--danger); }
    .tbtn.danger:hover { border-color: var(--danger); }
    #save-indicator { font-size: 12px; color: var(--muted); }

    /* layout */
    #body { display: flex; flex: 1; overflow: hidden; position: relative; }

    /* write pane */
    #write-pane {
      display: flex; flex-direction: column; flex: 1;
      padding: 20px 24px; overflow-y: auto;
    }
    #ts-label {
      font-size: 12px; color: var(--muted); margin-bottom: 14px;
      font-family: ui-monospace, monospace;
    }
    #editor {
      flex: 1; width: 100%; min-height: 300px; background: transparent;
      border: none; color: var(--text); font-family: var(--font);
      font-size: 16px; line-height: 1.7; resize: none; outline: none;
    }

    /* entries pane */
    #entries-pane {
      width: 300px; border-left: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
    }
    #entries-head {
      padding: 10px 12px; font-size: 11px; color: var(--muted);
      border-bottom: 1px solid var(--border); text-transform: uppercase;
      letter-spacing: 0.08em; flex-shrink: 0; display: flex; align-items: center; gap: 6px;
    }
    #entries-head .spacer { flex: 1; }
    #del-all-btn {
      font-size: 11px; color: var(--danger); background: none; border: none;
      cursor: pointer; font-family: var(--font); padding: 0; opacity: 0.7;
    }
    #del-all-btn:hover { opacity: 1; }
    #entries-list { flex: 1; overflow-y: auto; }
    .entry-row {
      padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .entry-row:hover { background: var(--bg2); }
    .entry-row.active { background: var(--bg3); border-left: 2px solid var(--accent); }
    .entry-ts {
      font-size: 11px; color: var(--muted); margin-bottom: 4px;
      font-family: ui-monospace, monospace;
    }
    .entry-body {
      font-size: 13px; color: var(--text); line-height: 1.5;
      white-space: pre-wrap; word-break: break-word;
      max-height: 80px; overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
      mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
    }

    /* read/edit pane overlay */
    #read-pane {
      display: none; position: absolute; inset: 0; background: var(--bg);
      z-index: 10; flex-direction: column;
    }
    #read-pane.open { display: flex; }
    #read-toolbar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    #read-toolbar .spacer { flex: 1; }
    #read-ts { font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace; }

    /* read vs edit modes */
    #read-text {
      flex: 1; padding: 24px; overflow-y: auto;
      font-size: 16px; line-height: 1.8; white-space: pre-wrap; word-break: break-word;
    }
    #read-editor {
      display: none; flex: 1; padding: 20px 24px; overflow-y: auto;
    }
    #read-editor textarea {
      width: 100%; height: 100%; min-height: 300px; background: transparent;
      border: none; color: var(--text); font-family: var(--font);
      font-size: 16px; line-height: 1.7; resize: none; outline: none;
    }

    /* confirm modal */
    #confirm-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      z-index: 50; align-items: center; justify-content: center;
    }
    #confirm-overlay.open { display: flex; }
    #confirm-box {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
      padding: 24px; max-width: 320px; width: 90%; display: flex; flex-direction: column; gap: 16px;
    }
    #confirm-box p { font-size: 14px; line-height: 1.5; color: var(--text); }
    #confirm-box .actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* toast */
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 8px 16px; font-size: 13px; color: var(--text);
      pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 100;
    }
    #toast.show { opacity: 1; }

    @media (max-width: 640px) {
      #entries-pane { display: none; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<!-- Gate -->
<div id="gate">
  <form id="gate-form">
    <input type="password" id="gate-input" placeholder="password" autocomplete="current-password" />
    <button type="submit">enter</button>
    <div class="err" id="gate-err" style="display:none">nope</div>
  </form>
</div>

<!-- App -->
<div id="app">
  <div id="toolbar">
    <button class="tbtn" id="new-btn">+ new</button>
    <span id="save-indicator"></span>
    <div class="spacer"></div>
    <button class="tbtn" id="date-btn" title="Insert timestamp (Ctrl+D)">📅 stamp</button>
    <button class="tbtn" id="copy-btn" title="Copy all entries as plain text">copy all</button>
  </div>

  <div id="body">
    <!-- Write pane -->
    <div id="write-pane">
      <div id="ts-label"></div>
      <textarea id="editor" placeholder="start writing…" spellcheck="true"></textarea>
    </div>

    <!-- Entries pane -->
    <div id="entries-pane">
      <div id="entries-head">
        <span>entries</span>
        <div class="spacer"></div>
        <button id="del-all-btn">delete all</button>
      </div>
      <div id="entries-list"></div>
    </div>

    <!-- Read/edit overlay -->
    <div id="read-pane">
      <div id="read-toolbar">
        <button class="tbtn" id="read-back">← back</button>
        <div class="spacer"></div>
        <span id="read-ts"></span>
        <button class="tbtn" id="read-toggle-edit">edit</button>
        <button class="tbtn danger" id="read-delete">delete</button>
      </div>
      <div id="read-text"></div>
      <div id="read-editor"><textarea id="read-textarea" spellcheck="true"></textarea></div>
    </div>
  </div>
</div>

<!-- Confirm modal -->
<div id="confirm-overlay">
  <div id="confirm-box">
    <p id="confirm-msg"></p>
    <div class="actions">
      <button class="tbtn" id="confirm-cancel">cancel</button>
      <button class="tbtn danger" id="confirm-ok">delete</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

let SESSION = null;
let entries = [];
let current = null;
let saveTimer = null;
let dirty = false;
let readId = null;
let readEditing = false;
let readSaveTimer = null;

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');

function nowTs() {
  const d = new Date();
  return `[${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}]`;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function setSaveIndicator(txt) { $('save-indicator').textContent = txt; }

/* ── Confirm ── */
function confirm(msg) {
  return new Promise(res => {
    $('confirm-msg').textContent = msg;
    $('confirm-overlay').classList.add('open');
    const ok = $('confirm-ok'), cancel = $('confirm-cancel');
    function cleanup() { $('confirm-overlay').classList.remove('open'); }
    ok.onclick = () => { cleanup(); res(true); };
    cancel.onclick = () => { cleanup(); res(false); };
  });
}

/* ── Gate ── */
$('gate-form').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('gate-input').value;
  const ok = await loadEntries(pw);
  if (ok) {
    SESSION = pw;
    $('gate').style.display = 'none';
    $('app').classList.add('open');
    renderEntries();
    newEntry();
  } else {
    $('gate-err').style.display = 'block';
  }
});

/* ── API ── */
async function api(method, body) {
  const res = await fetch('/api/jnl/entries', {
    method,
    headers: { 'Content-Type': 'application/json', 'X-JNL-Password': SESSION },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) return null;
  return res.json();
}

async function loadEntries(pw) {
  try {
    const res = await fetch('/api/jnl/entries', { headers: { 'X-JNL-Password': pw } });
    if (!res.ok) return false;
    entries = (await res.json()).entries || [];
    return true;
  } catch { return false; }
}

/* ── Write pane ── */
function newEntry() {
  current = null; dirty = false;
  $('editor').value = '';
  $('ts-label').textContent = nowTs();
  setSaveIndicator('');
  closeReadPane();
  renderEntries();
  $('editor').focus();
}

async function saveEntry(text) {
  if (!text.trim()) {
    if (current) {
      const id = current; current = null;
      entries = entries.filter(e => e.id !== id);
      renderEntries();
      await api('DELETE', { id });
    }
    return;
  }
  const ts = $('ts-label').textContent || nowTs();
  if (current) {
    const idx = entries.findIndex(e => e.id === current);
    if (idx >= 0) { entries[idx].text = text; entries[idx].ts = ts; }
    await api('PUT', { id: current, text, ts });
  } else {
    const id = Date.now().toString();
    current = id;
    entries.unshift({ id, ts, text });
    await api('POST', { id, ts, text });
  }
  renderEntries();
  setSaveIndicator('saved');
  setTimeout(() => setSaveIndicator(''), 2000);
}

function scheduleSave() {
  dirty = true; setSaveIndicator('…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveEntry($('editor').value), 1200);
}

$('editor').addEventListener('input', scheduleSave);
$('editor').addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
    e.preventDefault();
    insertAtCursor($('editor'), nowTs() + ' ');
  }
});

function insertAtCursor(ta, text) {
  const s = ta.selectionStart, end = ta.selectionEnd;
  ta.value = ta.value.slice(0, s) + text + ta.value.slice(end);
  ta.selectionStart = ta.selectionEnd = s + text.length;
  scheduleSave();
}

/* ── Toolbar ── */
$('new-btn').addEventListener('click', () => {
  if (dirty) { clearTimeout(saveTimer); saveEntry($('editor').value); }
  newEntry();
});
$('date-btn').addEventListener('click', () => { $('editor').focus(); insertAtCursor($('editor'), nowTs() + ' '); });
$('copy-btn').addEventListener('click', () => {
  if (!entries.length) { toast('nothing to copy'); return; }
  const all = [...entries].reverse().map(e => `${e.ts}\n\n${e.text.trim()}`).join('\n\n---\n\n');
  navigator.clipboard.writeText(all).then(() => toast('copied'));
});
$('del-all-btn').addEventListener('click', async () => {
  if (!entries.length) { toast('nothing to delete'); return; }
  const yes = await confirm(`Delete all ${entries.length} entries? This cannot be undone.`);
  if (!yes) return;
  entries = []; current = null;
  await api('DELETE', { all: true });
  renderEntries();
  newEntry();
  toast('deleted');
});

/* ── Entries list ── */
function renderEntries() {
  const list = $('entries-list'); list.innerHTML = '';
  for (const e of entries) {
    const row = document.createElement('div');
    row.className = 'entry-row' + (e.id === current && !readId ? ' active' : '') + (e.id === readId ? ' active' : '');
    row.innerHTML = `<div class="entry-ts">${esc(e.ts)}</div><div class="entry-body">${esc(e.text)}</div>`;
    row.addEventListener('click', () => openReadPane(e.id));
    list.appendChild(row);
  }
}

/* ── Read/edit pane ── */
function openReadPane(id) {
  const e = entries.find(e => e.id === id);
  if (!e) return;
  readId = id; readEditing = false;
  $('read-ts').textContent = e.ts;
  $('read-text').textContent = e.text;
  $('read-text').style.display = '';
  $('read-editor').style.display = 'none';
  $('read-toggle-edit').textContent = 'edit';
  $('read-pane').classList.add('open');
  renderEntries();
}

function closeReadPane() {
  $('read-pane').classList.remove('open');
  readId = null; readEditing = false;
  renderEntries();
}

$('read-back').addEventListener('click', closeReadPane);

$('read-toggle-edit').addEventListener('click', () => {
  const e = entries.find(e => e.id === readId);
  if (!e) return;
  if (!readEditing) {
    // switch to edit mode
    readEditing = true;
    $('read-textarea').value = e.text;
    $('read-text').style.display = 'none';
    $('read-editor').style.display = 'flex';
    $('read-toggle-edit').textContent = 'done';
    $('read-textarea').focus();
    $('read-textarea').oninput = () => {
      clearTimeout(readSaveTimer);
      readSaveTimer = setTimeout(async () => {
        const text = $('read-textarea').value;
        const idx = entries.findIndex(e => e.id === readId);
        if (idx >= 0) entries[idx].text = text;
        await api('PUT', { id: readId, text, ts: e.ts });
        $('read-text').textContent = text;
        renderEntries();
      }, 1000);
    };
  } else {
    // switch back to read mode
    readEditing = false;
    const text = $('read-textarea').value;
    $('read-text').textContent = text;
    $('read-text').style.display = '';
    $('read-editor').style.display = 'none';
    $('read-toggle-edit').textContent = 'edit';
  }
});

$('read-delete').addEventListener('click', async () => {
  const e = entries.find(e => e.id === readId);
  if (!e) return;
  const yes = await confirm(`Delete this entry from ${e.ts}?`);
  if (!yes) return;
  const id = readId;
  entries = entries.filter(e => e.id !== id);
  await api('DELETE', { id });
  closeReadPane();
  if (current === id) { current = null; $('editor').value = ''; $('ts-label').textContent = nowTs(); }
  renderEntries();
  toast('deleted');
});

/* ── Handle delete all in API (need server to support it) ── */
// already handled by sending all:true to DELETE endpoint

/* ── Init ── */
$('ts-label').textContent = nowTs();
</script>
</body>
</html>
